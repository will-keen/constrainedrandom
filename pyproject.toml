[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "constrainedrandom"
version = "1.2.2"
description = "A library for creating and solving constrained randomization problems"
readme = "README.md"
requires-python = ">=3.8.3"
license = { file="LICENSE" }
keywords = ["constraint", "constrained", "random", "randomization", "verification"]
authors = [
  { name="Will Keen", email="willkeencodes@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "python-constraint>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "bokeh>=3.4.1",
    "ruff>=0.16",
]
benchmarks = [
    "pyvsc",
]

[project.urls]
"Homepage" = "https://github.com/will-keen/constrainedrandom"
"Bug Tracker" = "https://github.com/will-keen/constrainedrandom/issues"

[tool.ruff]
line-length = 100
# Match the minimum supported runtime so pyupgrade fixes stay compatible.
target-version = "py38"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Assigning lambdas is the subject under test.
"tests/is_pure.py" = ["E731"]
# The pyvsc constraint DSL is written as bare comparisons and short names.
"benchmarks/**" = ["B015", "E741"]